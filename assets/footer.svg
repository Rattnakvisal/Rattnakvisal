<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="140" viewBox="0 0 1280 140" fill="none" role="img" aria-labelledby="title">
  <title id="title">Build with care. Keep improving.</title>
  <style>
    .wave { stroke-dasharray: 12 14; animation: stream 12s linear infinite; }
    .code { animation: breathe 5s ease-in-out infinite; }
    @keyframes stream { to { stroke-dashoffset: -260; } }
    @keyframes breathe { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @media (prefers-reduced-motion: reduce) { .wave, .code { animation: none; } }
  </style>
  <rect width="1280" height="140" rx="20" fill="#0D1818"/>
  <rect x="1" y="1" width="1278" height="138" rx="19" stroke="#28413B"/>
  <path d="M48 40V100" stroke="#63E6BE" stroke-width="3"/>
  <path class="wave" d="M840 140C920 140 930 30 1010 30S1130 140 1280 70" stroke="#63E6BE" stroke-opacity=".22" stroke-width="2"/>
  <text x="74" y="70" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="700" fill="#F0F6F3">Build with care. Keep improving.</text>
  <text x="75" y="99" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#A6C4B9">Always learning. Open to meaningful work and collaboration.</text>
  <text class="code" x="1205" y="82" text-anchor="end" font-family="Consolas, monospace" font-size="32" fill="#63E6BE">&lt;/&gt;</text>
</svg>
